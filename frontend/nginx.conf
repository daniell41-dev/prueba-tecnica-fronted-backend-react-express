server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html —
    # react-router se encarga de pintar la página correcta en el cliente.
    location / {
        try_files $uri /index.html;
    }

    # "api" es el nombre del servicio en docker-compose.yml — Docker lo
    # resuelve por su DNS interno, no hace falta una IP.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
